name: Build Flow AI images

on:
  push:
    branches: ['feat/flow-ai']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: flow-ai-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/mailflow-${{ matrix.service }}
          tags: |
            type=raw,value=flow-ai
            type=sha,prefix=flow-ai-
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_SHA=${{ github.sha }}
            VITE_BUILD_SHA=${{ github.sha }}
            APP_VERSION=4.0.4-flow-ai
          cache-from: type=gha,scope=flow-ai-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=flow-ai-${{ matrix.service }}
