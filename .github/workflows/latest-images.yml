name: Build latest images

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'CPU platforms to publish'
        required: true
        default: 'linux/amd64,linux/arm64'
        type: choice
        options:
          - 'linux/amd64,linux/arm64'
          - 'linux/amd64'
          - 'linux/arm64'

permissions:
  contents: read

concurrency:
  group: mailflow-latest-${{ github.repository }}
  cancel-in-progress: true

jobs:
  images:
    # latest always means this fork's main branch, including manual runs.
    if: github.ref == 'refs/heads/main'
    name: Publish latest ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - name: Check out the triggering main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Identify source and image
        id: source
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mailflow-$SERVICE" >> "$GITHUB_OUTPUT"
          node <<'NODE'
          const fs = require('node:fs');
          const version = JSON.parse(fs.readFileSync(process.env.SERVICE + '/package.json', 'utf8')).version;
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error('Invalid application version: ' + version);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + version + '\n');
          NODE

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: |
            ${{ steps.source.outputs.image }}:latest
            ${{ steps.source.outputs.image }}:sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
          build-args: |
            BUILD_SHA=${{ steps.source.outputs.sha }}
            VITE_BUILD_SHA=${{ steps.source.outputs.sha }}
            APP_VERSION=${{ steps.source.outputs.version }}
          provenance: false
          cache-from: type=gha,scope=latest-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=latest-${{ matrix.service }}

      - name: Deployment summary
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          APP_VERSION: ${{ steps.source.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published $IMAGE:latest"
            echo ""
            echo "Application version: $APP_VERSION"
            echo "Source branch: main"
            echo "Source commit: $SOURCE_SHA"
            echo "Pinned image: $IMAGE:sha-$SOURCE_SHA"
            echo "Digest: $DIGEST"
            echo ""
            echo "After BOTH image jobs succeed, update your server using docker-compose.latest.yml."
            echo "Instructions: https://github.com/$GITHUB_REPOSITORY/blob/main/docs/latest-images.md"
          } >> "$GITHUB_STEP_SUMMARY"
